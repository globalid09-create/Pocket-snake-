name: Build Android APK

on:
  push:
    branches: [ "main" ]          # Triggers on every push to main
  pull_request:
    branches: [ "main" ]          # Optional: also build on PRs
  workflow_dispatch:               # Allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Node.js for web build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 2. Setup Java (required for Android Gradle)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install dependencies & build web assets
      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        # ⚠️ Adjust this if your build script is different (e.g., `npm run build:prod`)

      # 5. Ensure Android platform exists
      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 6. Sync web assets to Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 7. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Upload the APK artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-snake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7